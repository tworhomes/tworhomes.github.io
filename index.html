<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F6F4EF">
    <title>Maryin Estefania Dos Ramos | Private Real Estate Advisory · North Carolina</title>
    <meta
      name="description"
      content="Maryin Estefania Dos Ramos — Top-producing North Carolina Real Estate Broker with eXp Realty ($17.03M+ career volume, 53+ closed homes). Bespoke buyer, new construction & seller representation across Raleigh, Durham, Cary & the Research Triangle in English & Español."
    >
    <style>
      /* Immediate anti-FOUC architectural canvas background */
      html, body {
        background-color: #141311;
        color: #F6F4EF;
        margin: 0;
        padding: 0;
        color-scheme: dark;
      }
      html[data-theme='light'], html[data-theme='light'] body {
        background-color: #F6F4EF;
        color: #141311;
        color-scheme: only light;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference');
          var isLight = true;
          if (saved === 'dark') {
            isLight = false;
          } else if (saved === 'light') {
            isLight = true;
          }
          var theme = isLight ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (isLight) {
            document.documentElement.style.colorScheme = 'only light';
            document.documentElement.style.backgroundColor = '#F6F4EF';
            document.documentElement.style.color = '#141311';
            if (metaTheme) metaTheme.setAttribute('content', '#F6F4EF');
          } else {
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.style.backgroundColor = '#141311';
            document.documentElement.style.color = '#F6F4EF';
            if (metaTheme) metaTheme.setAttribute('content', '#141311');
          }

          var savedLocale = localStorage.getItem('maryin-locale');
          if (!savedLocale) {
            var langs = navigator.languages || [navigator.language || ''];
            for (var i = 0; i < langs.length; i++) {
              if (langs[i] && langs[i].toLowerCase().indexOf('es') === 0) {
                savedLocale = 'es';
                break;
              }
            }
          }
          if (savedLocale) {
            document.documentElement.setAttribute('lang', savedLocale);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
